name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Verhindert gleichzeitige deployments
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

# Build und Test
jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17 einrichten
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build und Tests
        run: ./mvnw -B clean verify

      - name: Test- und Coverage-Berichte sichern
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore

  # Image bau
  image:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.meta.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Namen bestimmen
        id: meta
        run: |
          NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=${NAME}"              >> "$GITHUB_OUTPUT"
          echo "ref=${NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Image bauen und pushen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.name }}:latest
            ${{ steps.meta.outputs.ref }}

  # Deployment
  deploy:
    name: Deploy (lokaler PC)
    runs-on: self-hosted
    needs: image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
    env:
      APP_IMAGE: ${{ needs.image.outputs.ref }}
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Getestetes Image laden
        run: docker pull $env:APP_IMAGE

      - name: Stack aktualisieren
        run: docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --no-build --remove-orphans

      - name: Smoke-Test
        run: |
          $ok = $false
          for ($i = 1; $i -le 30; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:8081/actuator/health" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Write-Host "Warte auf die Anwendung... ($i/30)"
            Start-Sleep -Seconds 5
          }
          if (-not $ok) {
            docker compose -f docker-compose.yml -f docker-compose.deploy.yml logs --tail 120 app
            throw "Anwendung war nach 150 Sekunden nicht erreichbar."
          }
          Write-Host "Deployment erfolgreich: $env:APP_IMAGE"

      - name: Laufende Container
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.deploy.yml ps

  sonarqube:
    name: Code Quality (SonarCloud)
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: JDK 17 einrichten
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "zulu"

      - name: SonarQube-Cache
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Maven-Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build und Analyse
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=DevOps-Pipeline-Gruppe6 -Dsonar.projectName='DevOps-Pipeline-Gruppe6'
