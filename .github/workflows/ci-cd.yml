name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Verhindert gleichzeitige deployments
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

# Build und Test
jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17 einrichten
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build und Tests
        run: ./mvnw -B clean verify

      - name: Test- und Coverage-Berichte sichern
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore

  # Image bau
  image:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.meta.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Namen bestimmen
        id: meta
        run: |
          NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=${NAME}"              >> "$GITHUB_OUTPUT"
          echo "ref=${NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Image bauen und pushen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.name }}:latest
            ${{ steps.meta.outputs.ref }}

  # Deployment
  deploy:
    name: Deploy (lokaler PC)
    runs-on: self-hosted
    needs: image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
    env:
      APP_IMAGE: ${{ needs.image.outputs.ref }}
    defaults:
      run:
        shell: 'C:\Program Files\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Getestetes Image laden
        run: docker pull "$APP_IMAGE"

      - name: Stack aktualisieren
        run: |
          docker compose -f docker-compose.yml -f docker-compose.deploy.yml \
            up -d --no-build --remove-orphans

      - name: Smoke-Test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8081/actuator/health > /dev/null; then
              echo "Deployment erfolgreich: $APP_IMAGE"
              exit 0
            fi
            echo "Warte auf die Anwendung... ($i/30)"
            sleep 5
          done
          echo "Anwendung war nach 150 Sekunden nicht erreichbar."
          docker compose -f docker-compose.yml -f docker-compose.deploy.yml \
            logs --tail 120 app
          exit 1

      - name: Laufende Container
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.deploy.yml ps
