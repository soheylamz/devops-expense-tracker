spring.application.name=demo

# PostgreSQL-Verbindung. Defaults passen zu "docker compose up -d postgres";
# lokal ausserhalb Docker per Umgebungsvariablen ueberschreibbar.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expenses}
spring.datasource.username=${DB_USER:expenses}
spring.datasource.password=${DB_PASSWORD:expenses}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
