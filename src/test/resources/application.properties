# Gilt nur für Testläufe (überschreibt src/main/resources/application.properties
# auf dem Test-Klassenpfad). Die App selbst nutzt zur Laufzeit ausschließlich
# PostgreSQL (siehe README) — H2 dient hier nur dazu, dass `mvnw verify` ohne
# eine laufende Datenbank durchlaufen kann.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
